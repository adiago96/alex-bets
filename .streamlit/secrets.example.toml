# .streamlit/secrets.example.toml
#
# Copia este fichero como .streamlit/secrets.toml (ese sí queda fuera de git,
# ver .gitignore) y rellena tus datos reales. Cuando despliegues en Streamlit
# Community Cloud, pega el mismo contenido (ya relleno) en el panel de tu app:
# Settings -> Secrets.

# Cadena de conexión Postgres de tu proyecto de Supabase.
# Se encuentra en: Project Settings -> Database -> Connection string (URI).
DATABASE_URL = "postgresql://postgres:TU_PASSWORD@TU_PROYECTO.supabase.co:5432/postgres"

# Contraseña para entrar en la app. Si se deja vacía o se borra esta línea,
# la app no pide contraseña (pensado solo para pruebas en local).
APP_PASSWORD = "elige-una-contraseña"

[telegram]
# Consigue api_id y api_hash en https://my.telegram.org (API development tools).
api_id = 123456
api_hash = "tu_api_hash_aqui"
# @usuario público del canal, o su ID numérico si es privado.
canal = "@nombre_del_canal"
# Se rellena ejecutando UNA VEZ: python generar_sesion_telegram.py
session = ""
